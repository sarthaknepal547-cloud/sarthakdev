<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — Sarthak Dev Nepal</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230E0D12'/%3E%3Ctext x='50' y='72' font-family='Georgia,serif' font-size='64' fill='%23E8622C' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<script>
(function () {
  try {
    var saved = localStorage.getItem('sdn-theme');
    document.documentElement.dataset.theme = saved || 'dark';
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
html[data-theme="dark"] { --bg:#0E0D12; --text:#F2EFE9; --muted:#A5A0B0; --accent:#E8622C; --line:rgba(242,239,233,.12); }
html[data-theme="light"] { --bg:#FAF7F2; --text:#14121A; --muted:#5E5A6B; --accent:#C2410C; --line:rgba(20,18,26,.14); }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  background: var(--bg); color: var(--text);
  font-family: Inter, system-ui, sans-serif; font-weight: 300; padding: 2rem;
  text-align: center;
}
.big {
  font-family: "Instrument Serif", Georgia, serif; font-weight: 400;
  font-size: clamp(5rem, 22vw, 12rem); line-height: .85;
  letter-spacing: -.04em; color: var(--accent); margin: 0;
}
h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: clamp(1.4rem, 4vw, 2rem); margin: .5rem 0 .7rem; letter-spacing: -.01em; }
p { color: var(--muted); margin: 0 0 2rem; max-width: 34ch; }
a.btn {
  display: inline-block; padding: .8rem 1.6rem; border-radius: 100px;
  background: var(--accent); color: #fff; text-decoration: none; font-size: .9rem; font-weight: 500;
  transition: transform .25s ease, opacity .25s;
}
a.btn:hover { transform: translateY(-2px); opacity: .92; }
</style>
</head>
<body>
<div>
  <p class="big">404</p>
  <h1>This page doesn't exist</h1>
  <p>The link may be old, or the address might have a typo in it.</p>
  <a class="btn" href="/">Back to the site</a>
</div>
</body>
</html>
